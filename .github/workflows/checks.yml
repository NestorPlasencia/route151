name: Project checks
# Solo a mano (pestana Actions -> Run workflow): las mismas comprobaciones se
# corren en local antes de subir (lint, test, check:data y build).
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:data
      - run: npm run build
